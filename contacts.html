        <!-- MESSAGE FORM -->
        <h2>Send Me a Message</h2>

        <div class="contact-box">

            <form action="#" method="post">

                <label for="name"><b>Enter your Name:</b></label>&nbsp;<br>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
                <br>
                &nbsp;   &nbsp;
                <label for="email"><b>E-mail address:</b></label>
                &nbsp;<br>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
                <br>
                &nbsp;   &nbsp;
                <label for="subject"><b>Message Subject:</b></label>
                <br>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter message subject"
                >
                <br>
                &nbsp;

                <label for="message"><b>Enter your Message:</b></label>
                <br> &nbsp;
                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here..."
                    required
                ></textarea>

                <div class="checkbox-area">
                    <input
                        type="checkbox"
                        id="copy"
                        name="copy"
                    >

                    <label for="copy">
                        E-mail a copy of this message to your own address.
                    </label>
                </div>

                <button type="submit">Send</button>

            </form>

        </div>
